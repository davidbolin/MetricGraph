on:
  push:
    branches:
      - cran
  
name: R-CMD-check-CRAN

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel'}
          - {os: macOS-latest, r: 'devel'}
          - {os: macOS-latest, r: 'release'}
          - {os: macOS-latest, r: 'oldrel'}
          - {os: windows-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: 'https://inla.r-inla-download.org/R/testing https://mugglejinx.github.io/drat/ https://inlabru-org.r-universe.dev/'

      - name: Install R dependencies (Windows only)
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          install.packages("tinytex", repos = "https://cloud.r-project.org")

      - name: Install tinytex
        uses: r-lib/actions/setup-tinytex@v2
  
      - name: Install system dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal
          brew install udunits

      - name: Install Tidy on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Install Tidy on macOS
        if: runner.os == 'macOS'
        run: |
          brew install tidy-html5

      - name: Install Tidy on Windows
        if: runner.os == 'Windows'
        run: |
            choco install html-tidy --yes
            Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
            refreshenv

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
            dependencies: '"all"'
            extra-packages: |
               rcmdcheck
               V8

      - name: Session Info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--run-donttest", "--timings")'
          error-on: '"error"'

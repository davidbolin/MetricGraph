on:
  push:
    branches:
      - devel

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          extra-repositories: "https://inla.r-inla-download.org/R/testing"

      - name: Install system dependencies on Linux (GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y libglu1-mesa-dev libeigen3-dev
          sudo ln -s /usr/bin/gcc /usr/local/bin/gcc
          sudo ln -s /usr/bin/g++ /usr/local/bin/g++     

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             pkgdown
             github::davidbolin/rSPDE@devel
      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}
      - name: Installing rSPDE
        env:
          RSPDE_COMPILE: 1
        run: |
          install.packages(c("remotes", "rmarkdown"),dependencies=TRUE)
          # force: setup-r-dependencies already installed this commit (pure R),
          # so without it remotes skips the compiled reinstall.
          remotes::install_github("davidbolin/rSPDE", ref = "devel", force = TRUE)
          if (!nzchar(system.file("shared", "rspde_cgeneric_models.so", package = "rSPDE"))) {
            stop("rSPDE was installed without its compiled cgeneric library")
          }
        shell: Rscript {0}
      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy package
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
